<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>MindAR — видео на странице каталога</title>

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
        font-family: system-ui, sans-serif;
      }

      a-scene {
        position: fixed;
        inset: 0;
        width: 100% !important;
        height: 100% !important;
        background: transparent !important;
      }

      .a-canvas {
        background: transparent !important;
      }

      #hint {
        position: fixed;
        z-index: 10;
        left: 50%;
        bottom: max(20px, env(safe-area-inset-bottom));
        transform: translateX(-50%);
        width: max-content;
        max-width: calc(100% - 40px);
        box-sizing: border-box;
        padding: 10px 14px;
        color: #fff;
        background: rgba(0, 0, 0, 0.65);
        border-radius: 10px;
        text-align: center;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="hint">Наведите камеру на страницу каталога</div>

    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1; filterMinCF: 0.001; filterBeta: 0.01"
      color-space="sRGB"
      renderer="colorManagement: true; physicallyCorrectLights: true; alpha: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      embedded
    >
      <a-assets timeout="15000">
        <video id="video-1venilen__black" src="./video_1venilen__black.mp4" preload="metadata" muted playsinline webkit-playsinline crossorigin="anonymous" loop></video>
        <video id="video-2venilen__food" src="./video_2venilen__food.mp4" preload="metadata" muted playsinline webkit-playsinline crossorigin="anonymous" loop></video>
        <video id="video-3venilen__weel" src="./video_3venilen__weel.mp4" preload="metadata" muted playsinline webkit-playsinline crossorigin="anonymous" loop></video>
        <video id="video-4venilen__ball" src="./video_4venilen__ball.mp4" preload="metadata" muted playsinline webkit-playsinline crossorigin="anonymous" loop></video>
        <video id="video-5venilen__disk" src="./video_5venilen__disk.mp4" preload="metadata" muted playsinline webkit-playsinline crossorigin="anonymous" loop></video>
        <video id="video-6venilen__friends" src="./video_6venilen__friends.mp4" preload="metadata" muted playsinline webkit-playsinline crossorigin="anonymous" loop></video>
        <video id="video-7venilen__mini" src="./video_7venilen__mini.mp4" preload="metadata" muted playsinline webkit-playsinline crossorigin="anonymous" loop></video>
        <video id="video-8venilen__puller" src="./video_8venilen__puller.mp4" preload="metadata" muted playsinline webkit-playsinline crossorigin="anonymous" loop></video>
        <video id="video-9venilen__ring" src="./video_9venilen__ring.mp4" preload="metadata" muted playsinline webkit-playsinline crossorigin="anonymous" loop></video>
        <video id="video-10venilen__water" src="./video_10venilen__water.mp4" preload="metadata" muted playsinline webkit-playsinline crossorigin="anonymous" loop></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity class="ar-target" data-video="video-1venilen__black" data-target-height="1.3527131782945736" mindar-image-target="targetIndex: 0">
        <a-video src="#video-1venilen__black" visible="false" position="0 0 0.01" width="1" height="1" material="shader: flat; side: double"></a-video>
      </a-entity>

      <a-entity class="ar-target" data-video="video-2venilen__food" data-target-height="0.7215447154471545" mindar-image-target="targetIndex: 1">
        <a-video src="#video-2venilen__food" visible="false" position="0 0 0.01" width="1" height="1" material="shader: flat; side: double"></a-video>
      </a-entity>

      <a-entity class="ar-target" data-video="video-3venilen__weel" data-target-height="1.3549618320610688" mindar-image-target="targetIndex: 2">
        <a-video src="#video-3venilen__weel" visible="false" position="0 0 0.01" width="1" height="1" material="shader: flat; side: double"></a-video>
      </a-entity>

      <a-entity class="ar-target" data-video="video-4venilen__ball" data-target-height="1.4024294670846396" mindar-image-target="targetIndex: 3">
        <a-video src="#video-4venilen__ball" visible="false" position="0 0 0.01" width="1" height="1" material="shader: flat; side: double"></a-video>
      </a-entity>

      <a-entity class="ar-target" data-video="video-5venilen__disk" data-target-height="1.4024294670846396" mindar-image-target="targetIndex: 4">
        <a-video src="#video-5venilen__disk" visible="false" position="0 0 0.01" width="1" height="1" material="shader: flat; side: double"></a-video>
      </a-entity>

      <a-entity class="ar-target" data-video="video-6venilen__friends" data-target-height="1.4024294670846396" mindar-image-target="targetIndex: 5">
        <a-video src="#video-6venilen__friends" visible="false" position="0 0 0.01" width="1" height="1" material="shader: flat; side: double"></a-video>
      </a-entity>

      <a-entity class="ar-target" data-video="video-7venilen__mini" data-target-height="1.4024294670846396" mindar-image-target="targetIndex: 6">
        <a-video src="#video-7venilen__mini" visible="false" position="0 0 0.01" width="1" height="1" material="shader: flat; side: double"></a-video>
      </a-entity>

      <a-entity class="ar-target" data-video="video-8venilen__puller" data-target-height="1.4024294670846396" mindar-image-target="targetIndex: 7">
        <a-video src="#video-8venilen__puller" visible="false" position="0 0 0.01" width="1" height="1" material="shader: flat; side: double"></a-video>
      </a-entity>

      <a-entity class="ar-target" data-video="video-9venilen__ring" data-target-height="1.4024294670846396" mindar-image-target="targetIndex: 8">
        <a-video src="#video-9venilen__ring" visible="false" position="0 0 0.01" width="1" height="1" material="shader: flat; side: double"></a-video>
      </a-entity>

      <a-entity class="ar-target" data-video="video-10venilen__water" data-target-height="1.4024294670846396" mindar-image-target="targetIndex: 9">
        <a-video src="#video-10venilen__water" visible="false" position="0 0 0.01" width="1" height="1" material="shader: flat; side: double"></a-video>
      </a-entity>
    </a-scene>

    <script>
      const targets = document.querySelectorAll(".ar-target");
      const videos = document.querySelectorAll("video");
      const hint = document.querySelector("#hint");
      let activeVideo = null;
      let playbackRequest = 0;

      function showScanHint() {
        hint.hidden = false;
        hint.textContent = "Наведите камеру на страницу каталога";
      }

      function stopVideo(video) {
        video.pause();
        if (video.readyState >= 1) video.currentTime = 0;
      }

      function fitVideo(target, video) {
        if (!video.videoWidth || !video.videoHeight) return;

        const plane = target.querySelector("a-video");
        const targetWidth = 1;
        const targetHeight = Number(target.dataset.targetHeight);
        const videoAspect = video.videoWidth / video.videoHeight;
        const targetAspect = targetWidth / targetHeight;

        if (videoAspect > targetAspect) {
          plane.setAttribute("width", targetWidth);
          plane.setAttribute("height", targetWidth / videoAspect);
        } else {
          plane.setAttribute("height", targetHeight);
          plane.setAttribute("width", targetHeight * videoAspect);
        }
      }

      videos.forEach((video) => {
        // Эти свойства важны для autoplay в Safari, даже при наличии атрибутов.
        video.muted = true;
        video.playsInline = true;
      });

      targets.forEach((target) => {
        const video = document.querySelector(`#${target.dataset.video}`);
        const updateVideoSize = () => fitVideo(target, video);

        if (video.readyState >= 1) updateVideoSize();
        else video.addEventListener("loadedmetadata", updateVideoSize, { once: true });

        target.addEventListener("targetFound", async () => {
          ++playbackRequest;
          targets.forEach((item) => item.querySelector("a-video").setAttribute("visible", false));
          videos.forEach(stopVideo);
          activeVideo = video;
          await playActiveVideo();
        });

        target.addEventListener("targetLost", () => {
          stopVideo(video);
          target.querySelector("a-video").setAttribute("visible", false);
          if (activeVideo === video) {
            ++playbackRequest;
            activeVideo = null;
            showScanHint();
          }
        });

        // Показываем плоскость только после появления кадра, без чёрного прямоугольника.
        video.addEventListener("playing", () => {
          if (activeVideo !== video) {
            stopVideo(video);
            return;
          }
          updateVideoSize();
          target.querySelector("a-video").setAttribute("visible", true);
          hint.hidden = true;
        });
      });

      async function playActiveVideo() {
        const video = activeVideo;
        if (!video) return;
        const request = ++playbackRequest;
        try {
          await video.play();
        } catch (error) {
          if (activeVideo !== video || request !== playbackRequest) return;
          hint.hidden = false;
          hint.textContent = "Коснитесь экрана, чтобы запустить видео";
        }
      }

      // Запасной жест для строгих настроек autoplay на iPhone.
      document.addEventListener(
        "click",
        () => {
          if (activeVideo && activeVideo.paused) void playActiveVideo();
        },
        { passive: true }
      );
    </script>
  </body>
</html>
